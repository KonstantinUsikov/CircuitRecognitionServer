version: "3.8"
services:
  postgres:
    image: postgres:15
    container_name: diploma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diploma_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "15432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data: